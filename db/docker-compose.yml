services:
  db:
    build:
      context: ..
      dockerfile: packages/database/Dockerfile
    container_name: securepass-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securepass
    ports:
      - "5432:5432"
    volumes:
      - securepass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "securepass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  securepass-pgdata:
