services:
  db:
    build:
      context: .
      dockerfile: packages/db/dockerfile
    container_name: securepass-prod-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securepass
    ports:
      - "5432:5432"
    volumes:
      - securepass-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "securepass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
      args:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/securepass
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/securepass
      ENCRYPTION_KEY: sqIa6/Ucc4ULQ6P7b+h9CaTJJCSxpREmvJf0mci1MMk=
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      target: web
      args:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/securepass
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      ORIGIN: http://localhost:4173
      DATABASE_URL: postgresql://postgres:postgres@db:5432/securepass
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  securepass-prod-pgdata:
